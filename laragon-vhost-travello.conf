# Laragon Virtual Host Configuration for Travello
# File: C:\laragon\etc\apache2\sites-enabled\travello.conf

<VirtualHost *:80>
    DocumentRoot "C:\laragon\www\travello"
    ServerName travello.local
    ServerAlias www.travello.local
    
    <Directory "C:\laragon\www\travello">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Enable CORS for API
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With"
    
    # Proxy for Node.js backend API
    ProxyPreserveHost On
    ProxyRequests Off
    
    # API routes to Node.js backend (port 5000)
    ProxyPass /api http://localhost:5000/api
    ProxyPassReverse /api http://localhost:5000/api
    ProxyPass /socket.io http://localhost:5000/socket.io
    ProxyPassReverse /socket.io http://localhost:5000/socket.io
    
    # WebSocket support
    ProxyPass /ws ws://localhost:5000/ws
    ProxyPassReverse /ws ws://localhost:5000/ws
    
    # Error and access logs
    ErrorLog "C:\laragon\logs\travello.error.log"
    CustomLog "C:\laragon\logs\travello.access.log" combined
    
    # Performance optimizations
    EnableSendfile On
    EnableMMAP On
    
    # Compression
    LoadModule deflate_module modules/mod_deflate.so
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </Location>
</VirtualHost>

