<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Authentication Debug</h1>
    
    <div class="section">
        <h2>1. Test Registration</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="regEmail">Email:</label>
                <input type="email" id="regEmail" value="debug@test.com" required>
            </div>
            <div class="form-group">
                <label for="regUsername">Username:</label>
                <input type="text" id="regUsername" value="debuguser" required>
            </div>
            <div class="form-group">
                <label for="regDisplayName">Display Name:</label>
                <input type="text" id="regDisplayName" value="Debug User" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Password:</label>
                <input type="password" id="regPassword" value="debug123" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="registerResult" class="result" style="display: none;"></div>
    </div>
    
    <div class="section">
        <h2>2. Test Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" value="debug@test.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" value="debug123" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="loginResult" class="result" style="display: none;"></div>
    </div>
    
    <div class="section">
        <h2>3. Check Server Health</h2>
        <button onclick="checkHealth()">Check Health</button>
        <div id="healthResult" class="result" style="display: none;"></div>
    </div>
    
    <div class="section">
        <h2>4. Test Existing User</h2>
        <button onclick="testExistingUser()">Test with test@example.com</button>
        <div id="existingResult" class="result" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:55435/api';
        
        function showResult(elementId, data, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
            element.textContent = JSON.stringify(data, null, 2);
        }
        
        function showInfo(elementId, data) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'result info';
            element.textContent = JSON.stringify(data, null, 2);
        }
        
        // Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                email: document.getElementById('regEmail').value,
                username: document.getElementById('regUsername').value,
                displayName: document.getElementById('regDisplayName').value,
                password: document.getElementById('regPassword').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                showResult('registerResult', result, response.ok);
                
                if (response.ok) {
                    console.log('Registration successful:', result);
                }
            } catch (error) {
                showResult('registerResult', { error: error.message }, false);
            }
        });
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                showResult('loginResult', result, response.ok);
                
                if (response.ok) {
                    console.log('Login successful:', result);
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('user', JSON.stringify(result.data.user));
                }
            } catch (error) {
                showResult('loginResult', { error: error.message }, false);
            }
        });
        
        // Health Check
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const result = await response.json();
                showInfo('healthResult', result);
            } catch (error) {
                showResult('healthResult', { error: error.message }, false);
            }
        }
        
        // Test Existing User
        async function testExistingUser() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'test@example.com', 
                        password: 'test123' 
                    })
                });
                
                const result = await response.json();
                showResult('existingResult', result, response.ok);
                
                if (response.ok) {
                    console.log('Existing user login successful:', result);
                } else {
                    console.log('Existing user login failed:', result);
                }
            } catch (error) {
                showResult('existingResult', { error: error.message }, false);
            }
        }
        
        // Auto-check health on load
        window.addEventListener('load', checkHealth);
    </script>
</body>
</html>
