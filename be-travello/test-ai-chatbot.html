<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Test - Copywriter & Travel Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .send-btn:hover {
            background: #5a6fd8;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .suggestion-btn {
            padding: 6px 12px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .suggestion-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .status {
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
            background: #f8f9fa;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-section {
            padding: 20px;
            text-align: center;
        }

        .auth-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Chatbot Assistant</h1>
            <p>Copywriter Services & Travel Consultation</p>
        </div>

        <div id="authSection" class="auth-section">
            <h3>Masuk untuk Melanjutkan</h3>
            <input type="email" id="emailInput" class="auth-input" placeholder="Email (demo@travello.com)">
            <input type="password" id="passwordInput" class="auth-input" placeholder="Password (demo123)">
            <button onclick="login()" class="auth-btn">Login</button>
            <p style="margin-top: 10px; font-size: 12px; color: #666;">
                Demo: email=demo@travello.com, password=demo123
            </p>
        </div>

        <div id="chatSection" class="hidden">
            <div id="status" class="status">Ready to chat</div>
            
            <div id="chatContainer" class="chat-container">
                <div class="message ai">
                    <div class="message-content">
                        <div>👋 Halo! Saya adalah AI Assistant TRAVELLO, ahli dalam jasa copywriter dan travel consultation.</div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="messageInput" 
                        class="input-field" 
                        placeholder="Ketik pesan Anda..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button id="sendBtn" onclick="sendMessage()" class="send-btn">Kirim</button>
                </div>
                <div id="suggestions" class="suggestions"></div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;
        let sessionId = null;
        let isLoading = false;

        // Auto-login for demo
        window.onload = function() {
            document.getElementById('emailInput').value = 'demo@travello.com';
            document.getElementById('passwordInput').value = 'demo123';
        };

        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (data.success) {
                    authToken = data.token;
                    sessionId = `test_session_${Date.now()}`;
                    
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('chatSection').classList.remove('hidden');
                    
                    updateStatus('Logged in successfully');
                    loadSuggestions();
                } else {
                    alert('Login failed: ' + data.message);
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login error. Please try again.');
            }
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message || isLoading) return;

            isLoading = true;
            updateSendButton(true);
            updateStatus('Sending message...');

            // Add user message to chat
            addMessage(message, 'user');
            messageInput.value = '';

            try {
                const response = await fetch('/api/ai-chatbot/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: sessionId
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    addMessage(data.data.response, 'ai');
                    updateSuggestions(data.data.suggestions);
                    updateStatus('Connected');
                } else {
                    addMessage('❌ Error: ' + data.error, 'ai');
                    updateStatus('Error occurred');
                }
            } catch (error) {
                console.error('Send message error:', error);
                addMessage('❌ Connection error. Please try again.', 'ai');
                updateStatus('Connection error');
            } finally {
                isLoading = false;
                updateSendButton(false);
            }
        }

        function addMessage(content, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            // Convert markdown-like formatting to HTML
            content = content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/📝|🏝️|💰|🎯|💡|🎁|📋|🔄|🌟|🏛️|🐉|🏖️|🎒|💬|👋|🤖/g, match => match)
                .replace(/\n/g, '<br>');
            
            messageContent.innerHTML = content;
            
            const messageTime = document.createElement('div');
            messageTime.className = 'message-time';
            messageTime.textContent = new Date().toLocaleTimeString();
            
            messageContent.appendChild(messageTime);
            messageDiv.appendChild(messageContent);
            chatContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function loadSuggestions() {
            try {
                const response = await fetch('/api/ai-chatbot/suggestions', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    updateSuggestions(data.data.suggestions);
                }
            } catch (error) {
                console.error('Load suggestions error:', error);
            }
        }

        function updateSuggestions(suggestions) {
            const suggestionsContainer = document.getElementById('suggestions');
            suggestionsContainer.innerHTML = '';
            
            suggestions.forEach(suggestion => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = suggestion;
                btn.onclick = () => {
                    document.getElementById('messageInput').value = suggestion;
                    sendMessage();
                };
                suggestionsContainer.appendChild(btn);
            });
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function updateSendButton(loading) {
            const sendBtn = document.getElementById('sendBtn');
            if (loading) {
                sendBtn.innerHTML = '<div class="loading"></div>';
                sendBtn.disabled = true;
            } else {
                sendBtn.innerHTML = 'Kirim';
                sendBtn.disabled = false;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Test health check
        async function testHealth() {
            try {
                const response = await fetch('/api/ai-chatbot/health');
                const data = await response.json();
                console.log('Health check:', data);
            } catch (error) {
                console.error('Health check error:', error);
            }
        }

        // Test on load
        testHealth();
    </script>
</body>
</html>
