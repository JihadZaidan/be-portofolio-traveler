<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test User Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .messages { height: 300px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .admin { background: #f3e5f5; }
        input { width: 70%; padding: 5px; }
        button { width: 25%; padding: 5px; }
        .status { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test User Chat</h1>
        <div class="status" id="status">Connecting...</div>
        <div class="messages" id="messages"></div>
        <div>
            <input type="text" id="messageInput" placeholder="Type message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const socket = io('http://localhost:5000');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const statusDiv = document.getElementById('status');

        // User info
        const userName = 'Test User';
        const userEmail = 'test@example.com';
        const userId = userEmail.replace(/[@.]/g, '_');

        socket.on('connect', () => {
            console.log('Connected to server');
            statusDiv.textContent = 'Connected - Online';
            
            // Join chat as user
            socket.emit('join_chat', {
                userId: userId,
                userName: userName,
                userEmail: userEmail,
                role: 'user'
            });

            // Request chat history
            socket.emit('get_chat_history', { userId });
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            statusDiv.textContent = 'Disconnected';
        });

        socket.on('receive_message', (message) => {
            console.log('Received message:', message);
            addMessage(message.message, message.messageType === 'admin_to_user' ? 'admin' : 'user');
        });

        socket.on('chat_history', (data) => {
            console.log('Chat history:', data);
            messagesDiv.innerHTML = '';
            if (data.messages) {
                data.messages.forEach(msg => {
                    addMessage(msg.message, msg.messageType === 'admin_to_user' ? 'admin' : 'user');
                });
            }
        });

        socket.on('message_sent', (message) => {
            console.log('Message sent confirmation:', message);
        });

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && socket.connected) {
                console.log('Sending message:', message);
                socket.emit('send_message', {
                    message: message,
                    receiverId: 'admin',
                    receiverName: 'Admin',
                    messageType: 'user_to_admin'
                });
                messageInput.value = '';
            }
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
